name: Android build

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      IS_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') }}
      HAS_SIGNING: ${{ secrets.KEYSTORE_BASE64 != '' && secrets.KEYSTORE_PASSWORD != '' && secrets.KEY_ALIAS != '' && secrets.KEY_PASSWORD != '' }}

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: 'gradle'

      - name: Require signing secrets for releases
        if: env.IS_RELEASE == 'true' && env.HAS_SIGNING != 'true'
        run: |
          echo "::error::Release tags must be signed. Add KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS and KEY_PASSWORD as repository secrets."
          exit 1

      - name: Decode signing keystore
        if: env.HAS_SIGNING == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build release APK and bundle
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew :verifit:assembleRelease :verifit:bundleRelease

      - name: Verify APK signature
        if: env.HAS_SIGNING == 'true'
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs verifit/build/outputs/apk/release/verifit-release.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v5
        with:
          name: apk-release
          path: verifit/build/outputs/apk/release/*.apk

      - name: Upload release bundle (AAB)
        uses: actions/upload-artifact@v5
        with:
          name: aab-release
          path: verifit/build/outputs/bundle/release/*.aab

      - name: Create GitHub release
        if: env.IS_RELEASE == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            verifit/build/outputs/apk/release/verifit-release.apk
            verifit/build/outputs/bundle/release/verifit-release.aab
          generate_release_notes: true
