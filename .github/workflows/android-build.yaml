name: Android build

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: 'gradle'

      - name: Build debug APK, release APK and release bundle
        run: |
          chmod +x ./gradlew
          ./gradlew :verifit:assembleDebug :verifit:assembleRelease :verifit:bundleRelease

      - name: Upload debug APK
        uses: actions/upload-artifact@v5
        with:
          name: apk-debug
          path: verifit/build/outputs/apk/debug/*.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v5
        with:
          name: apk-release
          path: verifit/build/outputs/apk/release/*.apk

      - name: Upload release bundle (AAB)
        uses: actions/upload-artifact@v5
        with:
          name: aab-release
          path: verifit/build/outputs/bundle/release/*.aab

      - name: Create GitHub release
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        uses: softprops/action-gh-release@v2
        with:
          files: |
            verifit/build/outputs/apk/debug/*.apk
            verifit/build/outputs/apk/release/*.apk
            verifit/build/outputs/bundle/release/*.aab
          generate_release_notes: true
